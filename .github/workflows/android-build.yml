name: Build AARTI Typing Master

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          found=false
          for f in *.zip; do
            [ -f "$f" ] || continue
            unzip -q "$f" -d extracted
            found=true
          done
          if [ "$found" = false ]; then
            echo 'No ZIP file found in repository root'
            exit 1
          fi

      - name: Build APK
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo 'settings.gradle not found in ZIP'
            exit 1
          fi
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AARTI-Typing-Master-APK
          path: extracted/**/build/outputs/apk/**/*.apk
